services:
  - type: web
    name: demenag-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/ready
    preDeployCommand: cd /app/backend && npm run db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MAPS_USER_AGENT
        sync: false
