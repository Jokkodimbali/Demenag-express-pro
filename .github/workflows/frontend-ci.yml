name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le formatage du frontend
        run: npx prettier --check frontend/src frontend/index.html shared

      - name: Vérifier ESLint du frontend
        run: npx eslint frontend shared --max-warnings 0

      - name: Vérifier les types frontend
        run: npm run typecheck -w frontend

      - name: Construire le frontend comme sur Vercel
        run: npm run build -w frontend
